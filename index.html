  [["Was ist Dance Chance?","What is Dance Chance?","Wat is Dance Chance?","Was isch Dance Chance?"],
   ["Dance Chance ist eine Online-Tanzschule mit Video-Tanzkursen. Es gibt über 140 Unterrichts- und Figurenvideos. Die Stile: Discofox, Breakdance, Discowalzer und Latino, weitere sollen demnächst folgen.",
    "Dance Chance is an online dance school with video courses. There are over 140 lesson and figure videos. The styles are Discofox, Breakdance, Disco Waltz and Latino, with more coming soon.",
    "Dance Chance is en Online-Danzschull mit Video-Kurse. Do jitt et över 140 Unterrichts- un Figurevideos. Die Stile sin Discofox, Breakdance, Discowalzer un Latino, un mieh sollen demnächs noch kumme.","Dance Chance isch a Online-Tanzschul mit Video-Kurse. Do gibt's über 140 Unterrichts- und Figurevideos. D'Stil sin Discofox, Breakdance, Discowalzer und Latino, und weitere sollet bald no komma."]],
  [["Manfred und Nela","Manfred and Nela","Manfred und Nela","Dr Manfred und d'Nela"],
   ["Die Discofox- und Discowalzer-Kurse coachen Manfred und Nela (auf der Seite steht Nela). Sie lernten sich 2010 beim Tanzen kennen und heirateten 2016. Einsteigern wollen sie das Tanzen auf verständliche, leichte Art zeigen.",
    "Manfred and Nela coach the Discofox and Disco Waltz courses (the site spells her name Nela). They met while dancing in 2010 and married in 2016. They want to show beginners how to dance in a clear, easy way.",
    "De Discofox- un Discowalzer-Kurse maache dä Manfred un de Nela (op dä Sigg steit Nela). Se hann sich 2010 beim Danze kennejelihrt un 2016 jeheirot. Anfängern wollen se et Danze verständlich un leich zeije.","D'Discofox- und Discowalzer-Kurse macht dr Manfred mit dr Nela (uff dr Seite stoht Nela). Se hend sich 2010 beim Tanza kennaglernt und 2016 gheiratet. Aafänger sollet's Tanza verständlich und leicht zeigt kriega."]],
  [["Tanzen wie eine Sprache","Dancing is like a language","Danze wie en Sproch","Tanza wie a Sproch"],
   ["Der Leitgedanke: Tanzen und Discofox-Figuren lernen ist wie eine Sprache zu lernen. Du übst in deinem Tempo, so oft du willst, und kannst monatlich kündigen. Zum Reinschnuppern gibt es kostenlose Videos.",
    "The guiding idea: learning to dance and learning Discofox figures is like learning a language. You practise at your own pace, as often as you like, and can cancel monthly. There are free videos to try things out.",
    "Dä Leitjedanke: Danze un Discofox-Figure lihre is wie en Sproch lihre. Do övs en dingem Tempo, esu off wie de wells, un kanns monatlich künndije. Zum Erinschnuppere jitt et Jratis-Videos.","Dr Leitgedanke: Tanza und Discofox-Figura lerna isch wie a Sproch lerna. Du übsch in deim Tempo, so oft de witt, und kasch monatlich kündiga. Zum Neischnuppra gibt's Gratis-Videos."]]

 cards:[
  [["Spaß und Lächeln","Fun and smiles","Spaß un Laache","Spaß und Lächla"],
   ["Manfred sagt: Tanzen muss Spaß machen. Nela ergänzt trocken: Und der Mann schafft es, der Frau ein Lächeln ins Gesicht zu zaubern. Wenn beide lachen, stimmt der Rest meistens auch.",

  [["Führen und Folgen","Leading and following","Föhre un Följe","Fiahra und Folga"],
   ["Der Mann führt die Frau auf liebevolle Weise, und die Frau folgt ihm. Beides sind gleichwertige Aufgaben. Wichtig: Der Mann weiß immer, was er will, sonst wird die Frau unsicher.",
    "The man leads the woman in a loving way, and the woman follows him. Both are equally important jobs. What matters: the man always knows what he wants, otherwise the woman becomes unsure.",

  [["Der Arm über der Drehenden","The arm above the turner","Dä Arm övver dä, die sich dräht","Dr Arm ibr dr Drehende"],
   ["Beim Drehen geht der Arm des Führenden über den Kopf der Person, die sich dreht. So bleibt es für sie bequem und sicher. Manfred nennt das: erst der Arm, dann die Drehung.",
